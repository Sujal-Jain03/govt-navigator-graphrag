# Phase 13: the daily pipeline runs on GitHub Actions (free and
# unlimited on public repos) instead of the laptop's Task
# Scheduler. It discovers new official PDFs, ingests, extracts,
# rebuilds the graph + index, and commits the fresh data back to
# the repo — Streamlit Community Cloud redeploys from the push.
# The Docker rebuild step is skipped here (--no-rebuild): there
# is no Docker host on the runner, and the cloud app reads the
# data files straight from the repo.
#
# Required repository secrets (Settings -> Secrets -> Actions):
#   TAVILY_API_KEY, GROQ_API_KEY, ZHIPU_API_KEY, NVIDIA_API_KEY
name: daily-pipeline

on:
  schedule:
    # 02:30 UTC = 08:00 IST every day.
    - cron: "30 2 * * *"
  workflow_dispatch:  # manual run from the Actions tab

permissions:
  contents: write  # the job commits fresh data back to the repo

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache the embedding model (BGE-base, ~440 MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-base-en-v1.5

      - name: Install CPU-only torch first (the CUDA build is ~2.5 GB)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pipeline self-test (fake stages, no keys needed)
        run: python run_pipeline_test.py

      - name: Run the pipeline
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python run_pipeline.py --no-rebuild

      - name: Commit fresh data (no-op when nothing changed)
        run: |
          git config user.name "govt-navigator-bot"
          git config user.email "govt-navigator-bot@users.noreply.github.com"
          git add DATA processed_data
          git diff --cached --quiet || git commit -m "daily pipeline: $(date -u +%F)"
          git push
